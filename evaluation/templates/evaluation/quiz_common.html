<!DOCTYPE html>
<html>
<head>
    <title>Stage 1: Common Evaluation</title>
    <style>
        :root { --green: #2E8B57; --orange: #FF8C00; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; }
        .header { background: var(--green); color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .question { margin-bottom: 20px; padding: 15px; border-left: 5px solid var(--orange); background: #fff9f2; }
        .btn-submit { background: var(--orange); color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; }
        .btn-submit:hover { background: #e67e00; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Stage 1: Common Assessment</h1>
        <p>Subject: {{ subject.name }} | Difficulty: Mixed</p>
    </div>
    <div class="container">
        <form method="POST" action="{% url 'submit_common' subject.id %}">
            {% csrf_token %}
            {% for q in questions %}
            <div class="question">
                <p><strong>Q{{ forloop.counter }}:</strong> {{ q.question_text }}</p>
                <input type="radio" name="q_{{ q.id }}" value="A" required> {{ q.option_a }} <br>
                <input type="radio" name="q_{{ q.id }}" value="B"> {{ q.option_b }} <br>
                <input type="radio" name="q_{{ q.id }}" value="C"> {{ q.option_c }} <br>
                <input type="radio" name="q_{{ q.id }}" value="D"> {{ q.option_d }}
            </div>
            {% endfor %}
            <button type="submit" class="btn-submit">Submit Stage 1 & Determine Level</button>
        </form>
    </div>
</body>
</html>
