<style>
    .correct-box { border: 2px solid green; background: #e6ffed; padding: 10px; margin: 5px; }
    .wrong-box { border: 2px solid red; background: #ffeef0; padding: 10px; margin: 5px; }
    .highlight-green { color: green; font-weight: bold; }
</style>

<div class="container">
    <h2>Review Your Answers</h2>
    {% for q in questions %}
    <div class="{% if q.is_correct %}correct-box{% else %}wrong-box{% endif %}">
        <p><strong>{{ q.question_text }}</strong></p>
        <p>Your Choice: {{ q.user_choice }} | Correct Answer: <span class="highlight-green">{{ q.correct_option }}</span></p>
        
        <ul>
            <li {% if q.correct_option == 'A' %}class="highlight-green"{% endif %}>A: {{ q.option_a }}</li>
            <li {% if q.correct_option == 'B' %}class="highlight-green"{% endif %}>B: {{ q.option_b }}</li>
            <li {% if q.correct_option == 'C' %}class="highlight-green"{% endif %}>C: {{ q.option_c }}</li>
            <li {% if q.correct_option == 'D' %}class="highlight-green"{% endif %}>D: {{ q.option_d }}</li>
        </ul>
    </div>
    {% endfor %}
    <a href="{% url 'intermediate_results' subject.id %}" class="btn">Back to Summary</a>
</div>
